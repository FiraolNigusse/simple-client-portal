<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; }
  .btn { display: inline-block; padding: 10px 20px; background-color: #007bff; color: auto; text-decoration: none; border-radius: 5px; }
</style>
</head>
<body>
  <h2>Password Reset</h2>
  <p>You requested to reset your password for your account.</p>
  <p>
    <a href="{{ frontend_url }}/reset-password?uid={{ uid }}&token={{ token }}" class="btn">Reset Password</a>
  </p>
  <p>If you didn't request a password reset, you can safely ignore this email.</p>
</body>
</html>
